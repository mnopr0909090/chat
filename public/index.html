<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Divesh Chat</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💬</text></svg>" />
<style>
  :root {
    --bg: #f0f2f5;
    --panel: #ffffff;
    --text: #1a1a1a;
    --sub: #6b7280;
    --bubble-me: linear-gradient(135deg,#7c3aed,#4f46e5);
    --bubble-them: #e9ebef;
    --bubble-them-text: #1a1a1a;
    --accent: #7c3aed;
    --border: #e5e7eb;
    --header-grad: linear-gradient(135deg,#7c3aed,#4f46e5);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1115; --panel: #171a21; --text: #f2f2f2; --sub: #9aa0aa;
      --bubble-them: #232733; --bubble-them-text: #f2f2f2; --border: #2a2e38;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
  #app { height: 100%; display: flex; flex-direction: column; max-width: 560px; margin: 0 auto; background: var(--panel); }
  header { background: var(--header-grad); color: white; padding: 16px 18px; display: flex; align-items: center; gap: 12px; }
  header .avatar { width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,0.25); display:flex; align-items:center; justify-content:center; font-size:20px; }
  header h1 { margin: 0; font-size: 17px; }
  header p { margin: 2px 0 0; font-size: 12px; opacity: 0.85; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #4ade80; display:inline-block; margin-right:5px; }
  #messages { flex: 1; overflow-y: auto; padding: 16px 12px; display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; max-width: 82%; }
  .row.me { align-self: flex-end; justify-content: flex-end; }
  .row.them { align-self: flex-start; }
  .bubble { padding: 9px 13px; border-radius: 16px; font-size: 14.5px; line-height:1.4; word-wrap: break-word; white-space: pre-wrap; }
  .row.me .bubble { background: var(--bubble-me); color: white; border-bottom-right-radius: 4px; }
  .row.them .bubble { background: var(--bubble-them); color: var(--bubble-them-text); border-bottom-left-radius: 4px; }
  .meta { font-size: 10.5px; color: var(--sub); margin-top: 3px; }
  .row.me .meta { text-align: right; }
  .sender-label { font-size: 11px; font-weight: 700; color: var(--accent); margin-bottom: 2px; }
  .system-msg { text-align: center; font-size: 11.5px; color: var(--sub); margin: 4px 0; }
  #typing-indicator { font-size: 12px; color: var(--sub); padding: 0 16px 4px; min-height: 16px; }
  form#composer { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--border); }
  #text-input { flex: 1; border: 1px solid var(--border); border-radius: 22px; padding: 11px 16px; font-size: 15px; background: var(--bg); color: var(--text); outline: none; }
  #send-btn { width: 44px; height: 44px; border-radius: 50%; border: none; background: var(--header-grad); color: white; font-size: 18px; cursor: pointer; }
  #name-overlay { position: fixed; inset: 0; background: var(--header-grad); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 20px; }
  #name-card { background: var(--panel); color: var(--text); border-radius: 18px; padding: 28px 24px; max-width: 360px; width: 100%; text-align: center; }
  #name-card .emoji { font-size: 44px; margin-bottom: 8px; }
  #name-input { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--border); font-size: 15px; background: var(--bg); color: var(--text); outline: none; margin-bottom: 14px; }
  #name-submit { width: 100%; padding: 12px; border: none; border-radius: 12px; background: var(--header-grad); color: white; font-size: 15px; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="avatar">💬</div>
    <div>
      <h1>Divesh Chat</h1>
      <p><span class="dot"></span><span id="status-text">Connecting...</span></p>
    </div>
  </header>
  <div id="messages"></div>
  <div id="typing-indicator"></div>
  <form id="composer">
    <input id="text-input" type="text" placeholder="Message likho..." autocomplete="off" maxlength="1000" />
    <button id="send-btn" type="submit">➤</button>
  </form>
</div>

<div id="name-overlay">
  <div id="name-card">
    <div class="emoji">💬</div>
    <h2>Divesh Chat</h2>
    <p style="color:var(--sub);font-size:13.5px;margin-bottom:16px;">Apna naam likho aur chat shuru karo</p>
    <input id="name-input" type="text" placeholder="Aapka naam" maxlength="24" />
    <button id="name-submit">Chat shuru karo</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  var myName = null;
  var socket = io();
  var messagesEl = document.getElementById('messages');
  var statusText = document.getElementById('status-text');
  var typingEl = document.getElementById('typing-indicator');
  var typingTimeout = null;

  var nameOverlay = document.getElementById('name-overlay');
  var nameInput = document.getElementById('name-input');
  var nameSubmit = document.getElementById('name-submit');
  try {
    var saved = localStorage.getItem('divesh_chat_name');
    if (saved) nameInput.value = saved;
  } catch (e) {}

  function startChat() {
    var v = (nameInput.value || '').trim();
    if (!v) { nameInput.focus(); return; }
    myName = v;
    try { localStorage.setItem('divesh_chat_name', v); } catch (e) {}
    nameOverlay.style.display = 'none';
    socket.emit('join', myName);
  }
  nameSubmit.addEventListener('click', startChat);
  nameInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') startChat(); });

  function fmtTime(ts) {
    var d = new Date(ts);
    var h = d.getHours(), m = d.getMinutes();
    var ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12; if (h === 0) h = 12;
    return h + ':' + (m < 10 ? '0' + m : m) + ' ' + ampm;
  }

  var lastSender = null;
  function addMessage(msg) {
    var isMe = msg.sender === myName;
    var row = document.createElement('div');
    row.className = 'row ' + (isMe ? 'me' : 'them');
    var wrap = document.createElement('div');
    if (!isMe && msg.sender !== lastSender) {
      var label = document.createElement('div');
      label.className = 'sender-label';
      label.textContent = msg.sender;
      wrap.appendChild(label);
    }
    var bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = msg.text;
    wrap.appendChild(bubble);
    var meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = fmtTime(msg.ts);
    wrap.appendChild(meta);
    row.appendChild(wrap);
    messagesEl.appendChild(row);
    lastSender = msg.sender;
    messagesEl.scrollTop = messagesEl.scrollHeight + 1000;
  }

  function addSystem(text) {
    var div = document.createElement('div');
    div.className = 'system-msg';
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight + 1000;
  }

  socket.on('connect', function () {
    statusText.textContent = 'Connected';
    if (myName) socket.emit('join', myName);
  });
  socket.on('disconnect', function () {
    statusText.textContent = 'Disconnected...';
  });
  socket.on('history', function (msgs) {
    messagesEl.innerHTML = '';
    lastSender = null;
    msgs.forEach(addMessage);
  });
  socket.on('message', addMessage);
  socket.on('system', addSystem);
  socket.on('presence', function (users) {
    statusText.textContent = users.length + ' online';
  });
  socket.on('typing', function (name) {
    typingEl.textContent = name + ' is typing...';
    clearTimeout(typingTimeout);
    typingTimeout = setTimeout(function () { typingEl.textContent = ''; }, 2000);
  });

  var form = document.getElementById('composer');
  var input = document.getElementById('text-input');
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var text = input.value.trim();
    if (!text) return;
    socket.emit('message', { text: text });
    input.value = '';
  });
  input.addEventListener('input', function () {
    socket.emit('typing');
  });

  if (!nameInput.value) setTimeout(function () { nameInput.focus(); }, 300);
</script>
</body>
</html>
